## EnviroMesh Core — EMQX 5.x configuration (RPi 2)
##
## Mount at: /opt/emqx/etc/emqx.conf
##
## Configures:
##   - Port 8883 TLS listener for gateway connection from RPi 1
##   - Port 1883 TCP listener bound to 127.0.0.1 for local core services (FastAPI)
##   - Authentication and ACL authorization

node.name = "emqx@127.0.0.1"
node.data_dir = "/opt/emqx/data"

## ── Local plain MQTT listener (FastAPI subscriber) ──────────────────────────
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024
}

## ── TLS listener for RPi 1 Gateway ──────────────────────────────────────────
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 512
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile   = "/opt/emqx/etc/certs/server.crt"
    keyfile    = "/opt/emqx/etc/certs/server.key"
    verify     = verify_peer
    fail_if_no_peer_cert = false
  }
}

## Disable WebSockets (not needed for gateway forwarding)
listeners.ws.default.enable  = false
listeners.wss.default.enable = false

## Authentication
authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    password_hash_algorithm {
      name = bcrypt
    }
  }
]

## Authorization — ACL file
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

log.console {
  enable = true
  level  = warning
  formatter = text
}

