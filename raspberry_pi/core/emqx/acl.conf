%% EnviroMesh Core — Central EMQX ACL (RPi 2)
%%
%% EMQX 5.x file-based authorisation.
%% Mount at: /opt/emqx/etc/acl.conf
%%
%% PHILOSOPHY
%% ----------
%% Only the gateway forwarder (gw_forwarder) may publish gateway telemetry topics.
%% The backend subscriber (enviromesh_backend) may subscribe to those topics.
%% ESP32 nodes MUST NOT connect directly to this broker — all telemetry must
%% pass through RPi 1 first.
%%
%% USER ACCOUNT CREATION
%% ---------------------
%%   docker exec enviromesh-emqx-core emqx ctl admins add \
%%       --username gw_forwarder --password <STRONG_PASSWORD>
%%   docker exec enviromesh-emqx-core emqx ctl admins add \
%%       --username enviromesh_backend --password <STRONG_PASSWORD>

%% ── Gateway forwarder (RPi 1) ────────────────────────────────────────────────
%% May publish forwarded telemetry and gateway status
{allow, {username, "gw_forwarder"}, publish, [
    "enviromesh/gateway/+/telemetry",
    "enviromesh/gateway/+/status"
]}.

%% ── Backend subscriber ───────────────────────────────────────────────────────
%% May subscribe to all gateway telemetry and status topics
{allow, {username, "enviromesh_backend"}, subscribe, [
    "enviromesh/gateway/+/telemetry",
    "enviromesh/gateway/+/status"
]}.

%% ── Deny everything else ─────────────────────────────────────────────────────
{deny, all, all, ["#"]}.

