# ==============================================================================
# EnviroMesh — Nginx Gateway Reverse Proxy Configuration
# Single access point on port 80 (exposed on host as port 8080):
# - /     -> Dashboard frontend (static Nginx container)
# - /api/ -> FastAPI backend API (stripped prefix to http://backend:8000/)
# - /ws/  -> Real-time WebSocket telemetry stream
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Gzip compression for static assets and API JSON responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 1. Web Dashboard Frontend
    location / {
        proxy_pass http://dashboard:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend REST API
    # Trailing slash on proxy_pass strips the /api/ prefix:
    # e.g., /api/health -> /health, /api/devices/ -> /devices/
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. Dedicated WebSocket Stream
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for real-time telemetry streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Security: Do not expose the EMQX administration dashboard via this public server.
}
