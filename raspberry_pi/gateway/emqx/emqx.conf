## EnviroMesh Gateway — EMQX 5.x configuration (RPi 1)
##
## Mount at: /opt/emqx/etc/emqx.conf  (or set via environment variables)
##
## This file documents the key settings. Most are set via the EMQX_* env vars
## in docker-compose.yml. Override here only for settings that EMQX's env-var
## mapping does not expose.

## Listener — plain MQTT on port 1883 (no TLS — Wi-Fi nodes are on trusted LAN)
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 500
}

## Disable MQTT over WebSocket (not needed for this deployment)
listeners.ws.default.enable  = false
listeners.wss.default.enable = false

## Authentication — built-in database (accounts created via CLI or dashboard)
authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    password_hash_algorithm {
      name = bcrypt
    }
  }
]

## Authorisation — file-based ACL (acl.conf) + deny-by-default
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## Log to stdout (captured by Docker)
log.console {
  enable = true
  level  = warning
  formatter = text
}

## Persist data across restarts
node.data_dir = "/opt/emqx/data"

