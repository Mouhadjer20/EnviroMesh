%% EnviroMesh Gateway — Local EMQX ACL (RPi 1)
%%
%% EMQX 5.x file-based authorisation.
%% Mount this file at:  /opt/emqx/etc/acl.conf
%%
%% Format: {allow|deny, {user|ipaddr, Value}|all, publish|subscribe|pubsub, [TopicPattern]}.
%%
%% PHILOSOPHY
%% ----------
%% Each ESP32 node may only publish to its own telemetry topic.
%% The gateway ingestion service account may subscribe to all device topics.
%% Everything else is denied so a compromised device cannot inject data for
%% another device or intercept telemetry from peers.
%%
%% USER ACCOUNT CREATION
%% ---------------------
%% Create accounts inside the running EMQX container:
%%
%%   docker exec enviromesh-emqx-local emqx ctl admins add \
%%       --username gw_ingestion --password <STRONG_PASSWORD>
%%
%%   # For each ESP32 node:
%%   docker exec enviromesh-emqx-local emqx ctl admins add \
%%       --username g11 --password <NODE_PASSWORD>
%%
%% Alternatively configure credentials via the EMQX dashboard (127.0.0.1:18083)
%% under Authentication → Built-in Database.

%% ── ESP32 LoRa nodes (G11 / G41 publish after LoRa→MQTT bridge if needed) ──
{allow, {username, "g11"}, publish,   ["enviromesh/devices/G11/telemetry"]}.
{allow, {username, "g41"}, publish,   ["enviromesh/devices/G41/telemetry"]}.

%% ── ESP32 Wi-Fi nodes ──────────────────────────────────────────────────────
{allow, {username, "g31"}, publish,   ["enviromesh/devices/G31/telemetry"]}.
{allow, {username, "g61"}, publish,   ["enviromesh/devices/G61/telemetry"]}.
{allow, {username, "g42"}, publish,   ["enviromesh/devices/G42/telemetry"]}.
{allow, {username, "g43"}, publish,   ["enviromesh/devices/G43/telemetry"]}.

%% ── Gateway ingestion service ───────────────────────────────────────────────
{allow, {username, "gw_ingestion"}, subscribe, ["enviromesh/devices/+/telemetry"]}.

%% ── Deny everything else ───────────────────────────────────────────────────
{deny, all, all, ["#"]}.

