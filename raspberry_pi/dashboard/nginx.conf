# ==============================================================================
# EnviroMesh Dashboard — Nginx server block (dashboard container, port 80)
# Serves the React/Vite SPA and falls back to index.html for client-side routing.
# The upstream Nginx gateway (infrastructure/nginx/default.conf) proxies all
# /api/* traffic to the FastAPI backend — this file only handles static assets.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for JS/CSS bundles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so React Router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }
}

