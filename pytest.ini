[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    hardware: marks tests requiring physical hardware (SX1278, GPIO, SPI, real ESP32)
    integration: marks end-to-end integration tests
    gateway: marks gateway-specific unit tests
    core: marks core/backend-specific unit tests

