%% ==============================================================================
%% EnviroMesh — EMQX MQTT Access Control List (ACL)
%% Defines topic isolation, client authorization, and role permissions.
%% Syntax: {allow|deny, [who], [action: publish|subscribe|all], [topics]}.
%% ==============================================================================

%% 1. Backend Application & Services
%% Full publish & subscribe rights for the core server backend
{allow, {username, "enviromesh_backend"}, all, ["#", "$SYS/#"]}.

%% 2. Local Administration & Health Monitoring
{allow, {ipaddr, "127.0.0.1"}, all, ["#", "$SYS/#"]}.

%% 3. Field Sensor Nodes (G11, G41, G31, G61, G42, G43)
%% Nodes can publish telemetry to their designated topic
{allow, all, publish, ["enviromesh/devices/%c/telemetry", "enviromesh/devices/%u/telemetry", "enviromesh/devices/+/telemetry"]}.

%% Nodes can subscribe to their designated actuator/command topic
{allow, all, subscribe, ["enviromesh/devices/%c/commands/#", "enviromesh/devices/%u/commands/#"]}.

%% 4. Web Dashboard & Operator Clients
%% Dashboard clients can monitor all device telemetry streams
{allow, all, subscribe, ["enviromesh/devices/+/telemetry", "enviromesh/devices/#"]}.

%% Operators can publish actuator commands to devices
{allow, all, publish, ["enviromesh/devices/+/commands/#"]}.

%% 5. Default Catch-All: Allow internal telemetry topics, deny everything else
{allow, all, all, ["enviromesh/#"]}.
{deny, all, all, ["#"]}.
