name: enviromesh

services:
  # MQTT broker for Wi-Fi ESP32 nodes and the LoRa gateway process
  emqx:
    image: emqx/emqx:5.8.8
    container_name: enviromesh-emqx
    hostname: emqx
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      # MQTT listener — accessible from any network the RPi is connected to
      - "${MQTT_BIND_IP:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
      # EMQX dashboard — accessible from the same LAN subnet as the RPi
      # Set EMQX_DASHBOARD_BIND_IP=127.0.0.1 in .env to restrict to localhost only
      - "${EMQX_DASHBOARD_BIND_IP:-0.0.0.0}:${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./infrastructure/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      - enviromesh

  # PostgreSQL database with TimescaleDB extension
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16-oss # Lite version for RPi 3, 4 and 5
    container_name: enviromesh-timescaledb
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - timescale_data:/var/lib/postgresql/data
    # No public database port; application services use the internal network.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - enviromesh

  # Python API, MQTT Subscriber, validation, and database writer
  backend:
    build:
      context: ./raspberry_pi/backend
      dockerfile: Dockerfile
    container_name: enviromesh-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 8000

      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_APP_USERNAME}
      MQTT_PASSWORD: ${MQTT_APP_PASSWORD}
      MQTT_TOPIC: enviromesh/devices/+/telemetry

      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    expose:
      - "8000"
    privileged: true
    volumes:
      - /dev:/dev
    networks:
      - enviromesh

  # Web dashboard frontend
  dashboard:
    build:
      context: ./raspberry_pi/dashboard
      dockerfile: Dockerfile
    container_name: enviromesh-dashboard
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - enviromesh

  # Single entry point for browser access to the dashboard and API
  nginx:
    image: nginx:1.28-alpine
    container_name: enviromesh-nginx
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - enviromesh

volumes:
  emqx_data:
  emqx_log:
  timescale_data:

networks:
  enviromesh:
    driver: bridge
